<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One important question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150a26; --plum:#2a1247; --rose:#ff6f9f; --peach:#ffb48f; --gold:#ffd98a; --cream:#fff3ea;
  --muted:rgba(255,243,234,.66);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 16s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vmax;height:60vmax;background:#ff5c93;left:-20vmax;top:-25vmax;opacity:.32}
.aurora i:nth-child(2){width:55vmax;height:55vmax;background:#7b3fe4;right:-22vmax;bottom:-25vmax;animation-delay:-6s}
.aurora i:nth-child(3){width:35vmax;height:35vmax;background:#ff9a6b;left:40%;top:35%;opacity:.16;animation-delay:-10s}
@keyframes drift{to{transform:translate(6vmax,-4vmax) scale(1.15)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
canvas{position:fixed;inset:0;z-index:2;pointer-events:none}

.page{position:relative;z-index:3;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.card{position:relative;width:min(720px,100%);padding:clamp(28px,6vw,58px) clamp(20px,5vw,52px);text-align:center;
  border-radius:40px;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
  backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);
  box-shadow:0 40px 120px rgba(8,0,24,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from 180deg,transparent,rgba(255,111,159,.7),transparent 30%,rgba(255,217,138,.5),transparent 65%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.7}

.gift{width:112px;height:112px;margin:0 auto 20px;display:block;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(255,111,159,.45))}
.gift .lid{transform-origin:20px 44px;animation:wiggle 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-6deg)}94%{transform:rotate(4deg)}}

.pill{display:inline-block;padding:7px 16px;margin-bottom:20px;border-radius:99px;font-size:13px;font-weight:500;color:var(--peach);
  background:rgba(255,180,143,.1);border:1px solid rgba(255,180,143,.25)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,8vw,76px);line-height:1;letter-spacing:-.025em;
  background:linear-gradient(120deg,#fff 10%,#ffd6e4 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em{font-style:italic;font-weight:400}
.sub{max-width:440px;margin:18px auto 0;color:var(--muted);font-size:clamp(15px,2.4vw,18px);line-height:1.6}

.arena{position:relative;width:min(560px,100%);height:170px;margin:34px auto 0}
.btn{position:absolute;top:50%;border:0;border-radius:99px;font:700 17px var(--sans);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#yes{left:32%;padding:17px 34px;color:#fff;transform:translate(-50%,-50%) scale(var(--s,1));
  background:linear-gradient(135deg,var(--rose),#ff8a6b);
  box-shadow:0 12px 34px rgba(255,111,159,.5),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .35s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}
#yes:hover{box-shadow:0 16px 46px rgba(255,111,159,.75),inset 0 1px 0 rgba(255,255,255,.5)}
#yes:active{transform:translate(-50%,-50%) scale(calc(var(--s,1)*.96))}
#no{left:70%;padding:15px 26px;color:var(--cream);font-weight:500;transform:translate(-50%,-50%);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  transition:left .28s cubic-bezier(.2,1.2,.3,1),top .28s cubic-bezier(.2,1.2,.3,1)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.taunt{min-height:22px;margin-top:6px;font-size:14px;color:rgba(255,243,234,.5);font-style:italic;font-family:var(--serif)}

.win{display:none}
.win.show{display:block;animation:pop .8s cubic-bezier(.2,1.3,.3,1)}
.q.hide{display:none}
.win h2{font-family:var(--serif);font-weight:500;font-size:clamp(46px,10vw,88px);line-height:1;letter-spacing:-.03em;margin:6px 0 14px;
  background:linear-gradient(120deg,#fff,#ffc2d8 55%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.win p{color:var(--muted);font-size:18px;line-height:1.6}
.again{margin-top:26px;padding:12px 24px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--cream);font:500 14px var(--sans);cursor:pointer}
.again:hover{background:rgba(255,255,255,.16)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(24px)}}

@media(max-width:560px){.arena{height:190px}#yes{left:30%}#no{left:72%}.card{border-radius:30px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>
<canvas id="fx"></canvas>

<main class="page">
  <section class="card">
    <div class="q" id="q">
      <svg class="gift" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fb5"/><stop offset="1" stop-color="#ff5c93"/></linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#ffc463"/></linearGradient>
        </defs>
        <rect x="16" y="52" width="88" height="56" rx="8" fill="url(#g1)"/>
        <rect x="53" y="52" width="14" height="56" fill="url(#g2)"/>
        <g class="lid">
          <rect x="10" y="36" width="100" height="22" rx="7" fill="#ff7aa6"/>
          <rect x="53" y="36" width="14" height="22" fill="url(#g2)"/>
          <path d="M60 36C44 36 34 26 40 18s18 4 20 18Z M60 36C76 36 86 26 80 18s-18 4-20 18Z" fill="url(#g2)"/>
        </g>
      </svg>
      <div class="pill">A very important question</div>
      <h1>Will you buy<br>me <em>something?</em></h1>
      <p class="sub">Take your time and think it over. There may be consequences.</p>
      <div class="arena" id="arena">
        <button class="btn" id="yes" type="button">Yes, of course</button>
        <button class="btn" id="no" type="button">No</button>
      </div>
      <div class="taunt" id="taunt" aria-live="polite">The No button looks a little nervous.</div>
    </div>

    <div class="win" id="win">
      <svg class="gift" viewBox="0 0 120 120" aria-hidden="true" style="margin-bottom:6px">
        <rect x="16" y="52" width="88" height="56" rx="8" fill="url(#g1)"/>
        <rect x="53" y="52" width="14" height="56" fill="url(#g2)"/>
        <rect x="10" y="36" width="100" height="22" rx="7" fill="#ff7aa6" transform="rotate(-8 10 36) translate(-4 -14)"/>
        <path d="M60 30c-4-16 4-22 8-16s-2 12-8 16Z" fill="url(#g2)"/>
      </svg>
      <h2>Yayyy!</h2>
      <p>I knew you would say yes.<br>Best decision of your day.</p>
      <button class="again" id="again" type="button">Ask again</button>
    </div>
  </section>
</main>

<script>
const arena=document.getElementById('arena'),no=document.getElementById('no'),yes=document.getElementById('yes'),
  q=document.getElementById('q'),win=document.getElementById('win'),taunt=document.getElementById('taunt');
const lines=["Nice try.","Too slow.","The No button is off duty.","Are you sure about that?","Just press Yes.","It really does not want to be clicked.","Yes is getting bigger, have you noticed?","Give up, you know the answer."];
let dodges=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function flee(px,py){
  const a=arena.getBoundingClientRect(),b=no.getBoundingClientRect();
  const w=b.width,h=b.height,cx=b.left+w/2,cy=b.top+h/2;
  const minX=w/2+6,maxX=a.width-w/2-6,minY=h/2+6,maxY=a.height-h/2-6;
  let best={x:cx-a.left,y:cy-a.top},bs=-1;
  for(let i=0;i<60;i++){
    const x=minX+Math.random()*(maxX-minX),y=minY+Math.random()*(maxY-minY);
    let s=Math.hypot(a.left+x-px,a.top+y-py);
    const yb=yes.getBoundingClientRect();
    if(a.left+x>yb.left-w/2&&a.left+x<yb.right+w/2&&a.top+y>yb.top-h/2&&a.top+y<yb.bottom+h/2)s-=400;
    if(s>bs){bs=s;best={x,y}}
  }
  no.style.left=best.x+'px';no.style.top=best.y+'px';
  dodges++;
  yes.style.setProperty('--s',Math.min(1+dodges*.05,1.5));
  taunt.textContent=lines[dodges%lines.length];
}
arena.addEventListener('pointermove',e=>{
  const b=no.getBoundingClientRect();
  if(Math.hypot(e.clientX-(b.left+b.width/2),e.clientY-(b.top+b.height/2))<120)flee(e.clientX,e.clientY);
},{passive:true});
['pointerdown','click'].forEach(t=>no.addEventListener(t,e=>{e.preventDefault();flee(e.clientX,e.clientY)}));
no.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];flee(t.clientX,t.clientY)},{passive:false});
no.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const b=no.getBoundingClientRect();flee(b.left+b.width/2+1,b.top+b.height/2)}});

/* canvas: drifting petals + confetti */
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');
let W,H,parts=[];
function size(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
const cols=['#ff6f9f','#ffb48f','#ffd98a','#c9a7ff','#fff3ea'];
function petal(){return{x:Math.random()*W,y:H+20,vx:(Math.random()-.5)*.5,vy:-(.4+Math.random()*.7),r:4+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.03,c:cols[Math.random()*3|0],life:1,type:'petal',o:.35}}
function burst(){
  for(let i=0;i<160;i++){const ang=Math.random()*Math.PI*2,sp=4+Math.random()*10;
    parts.push({x:W/2,y:H/2,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-4,r:4+Math.random()*6,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],life:1,type:'conf',o:1})}
}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s,x,y-s*.4);ctx.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.3,x,y+s*.35);ctx.fill()}
let last=0;
function tick(t){
  ctx.clearRect(0,0,W,H);
  if(t-last>700&&parts.length<40){parts.push(petal());last=t}
  parts=parts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.a+=p.va;
    if(p.type==='conf'){p.vy+=.28;p.vx*=.985;p.life-=.007}
    else p.x+=Math.sin(p.a)*.4;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,p.life)*p.o;ctx.fillStyle=p.c;
    if(p.type==='petal')heart(0,0,p.r*1.4);else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
    ctx.restore();
    return p.life>0&&p.y>-40&&p.y<H+60;
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

yes.addEventListener('click',()=>{q.classList.add('hide');win.classList.add('show');burst();setTimeout(burst,350);setTimeout(burst,700)});
document.getElementById('again').addEventListener('click',()=>{
  win.classList.remove('show');q.classList.remove('hide');dodges=0;
  yes.style.setProperty('--s',1);no.style.left='';no.style.top='';taunt.textContent='The No button looks a little nervous.';
});
</script>
</body>
</html>
